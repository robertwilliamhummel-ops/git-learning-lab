<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TechFlow Solutions Invoice Generator - Professional invoicing system for IT services and business support">
    <meta name="robots" content="noindex, nofollow">
    <title>Invoice Generator - TechFlow Solutions</title>
    
    <!-- Canonical -->
    <link rel="canonical" href="https://techflowsolutions.ca/InvoiceSystem/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:locale" content="en_CA">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/invoice.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Auth Check -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAXjjNSClbsrtmMAbB_KuOEX8EnOn5N_0k",
            authDomain: "techflow-website-2026.firebaseapp.com",
            projectId: "techflow-website-2026",
            storageBucket: "techflow-website-2026.firebasestorage.app",
            messagingSenderId: "904705508663",
            appId: "1:904705508663:web:f1847a3d6d86abaa5e46b2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Not logged in - redirect to login page
                window.location.href = 'login.html';
            } else {
                // User is logged in - show email in header
                const userEmailElement = document.getElementById('user-email');
                if (userEmailElement) {
                    userEmailElement.textContent = user.email;
                }
            }
        });

        // Add logout button functionality
        window.logout = () => {
            if (confirm('Are you sure you want to logout?')) {
                signOut(auth).then(() => {
                    window.location.href = 'login.html';
                }).catch((error) => {
                    console.error('Logout error:', error);
                    alert('Error logging out. Please try again.');
                });
            }
        };
    </script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="../assets/images/TechFlow Solutions Logo- Cropped.png" alt="TechFlow Solutions Logo" class="logo-image">
                </div>
                <h1>Invoice Generator</h1>
                <div class="user-info">
                    <span id="user-email" style="margin-right: 15px; color: #ecf0f1; font-size: 0.9rem;"></span>
                    <button onclick="logout()" class="btn btn-outline" style="padding: 8px 16px; font-size: 0.9rem;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Invoice Form -->
            <div class="invoice-form-section">
                <div class="form-card">
                    <h2><i class="fas fa-file-invoice"></i> Create Invoice</h2>
                    
                    <!-- Customer Information -->
                    <section class="form-section">
                        <h3>Customer Information</h3>
                        <div class="customer-controls">
                            <select id="existing-customer" class="form-control">
                                <option value="">Select existing customer or add new</option>
                            </select>
                            <button type="button" id="new-customer-btn" class="btn btn-secondary">
                                <i class="fas fa-plus"></i> New Customer
                            </button>
                        </div>
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="customer-name">Customer Name *</label>
                                <input type="text" id="customer-name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="customer-company">Company</label>
                                <input type="text" id="customer-company" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="customer-phone">Phone *</label>
                                <input type="tel" id="customer-phone" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="customer-email">Email</label>
                                <input type="email" id="customer-email" class="form-control">
                            </div>
                            <div class="form-group full-width">
                                <label for="customer-address">Address</label>
                                <textarea id="customer-address" class="form-control" rows="2"></textarea>
                            </div>
                        </div>
                        
                        <button type="button" id="save-customer-btn" class="btn btn-outline">
                            <i class="fas fa-save"></i> Save Customer
                        </button>
                    </section>

                    <!-- Invoice Details -->
                    <section class="form-section">
                        <h3>Invoice Details</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="invoice-number">Invoice Number</label>
                                <input type="text" id="invoice-number" class="form-control" readonly>
                            </div>
                            <div class="form-group">
                                <label for="invoice-date">Date</label>
                                <input type="date" id="invoice-date" class="form-control" required>
                            </div>
                            <div class="form-group full-width">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="charge-hst" class="form-checkbox">
                                    <span>Charge HST (13%) - Only check if HST registered</span>
                                </label>
                            </div>
                        </div>
                    </section>

                    <!-- Service Information -->
                    <section class="form-section">
                        <h3>Services</h3>
                        
                        <!-- Hourly Services -->
                        <div class="service-type-section">
                            <h4><i class="fas fa-clock"></i> Hourly Services</h4>
                            <div id="hourly-services-container">
                                <!-- Hourly service entries will be added dynamically -->
                            </div>
                            <button type="button" id="add-hourly-service-btn" class="btn btn-secondary">
                                <i class="fas fa-plus"></i> Add Hourly Service
                            </button>
                            <div class="hourly-total">
                                <span class="total-label">Hourly Services Total:</span>
                                <span id="hourly-total" class="total-amount">$0.00</span>
                            </div>
                        </div>

                        <!-- Custom Line Items -->
                        <div class="service-type-section">
                            <h4><i class="fas fa-list"></i> Custom Line Items</h4>
                            <div id="line-items-container">
                                <!-- Line items will be added dynamically -->
                            </div>
                            <button type="button" id="add-line-item-btn" class="btn btn-secondary">
                                <i class="fas fa-plus"></i> Add Line Item
                            </button>
                            <div class="line-items-total">
                                <span class="total-label">Line Items Total:</span>
                                <span id="line-items-total" class="total-amount">$0.00</span>
                            </div>
                        </div>

                        <!-- Invoice Total -->
                        <div class="invoice-totals">
                            <div class="subtotal-row">
                                <span class="total-label">Subtotal:</span>
                                <span id="subtotal" class="total-amount">$0.00</span>
                            </div>
                            <div class="tax-row">
                                <span class="total-label">HST (13%):</span>
                                <span id="tax-amount" class="total-amount">$0.00</span>
                            </div>
                            <div class="total-row">
                                <span class="total-label">Total:</span>
                                <span id="final-total" class="total-amount">$0.00</span>
                            </div>
                        </div>
                    </section>

                    <!-- Action Buttons -->
                    <div class="form-actions">
                        <button type="button" id="preview-invoice-btn" class="btn btn-primary">
                            <i class="fas fa-eye"></i> Preview Invoice
                        </button>
                        <button type="button" id="print-invoice-btn" class="btn btn-secondary">
                            <i class="fas fa-print"></i> Print Invoice
                        </button>
                        <button type="button" id="clear-form-btn" class="btn btn-outline">
                            <i class="fas fa-refresh"></i> Clear Form
                        </button>
                    </div>
                </div>
            </div>

            <!-- Invoice Preview -->
            <div id="invoice-preview" class="invoice-preview-section" style="display: none;">
                <div class="invoice-document">
                    <!-- Invoice preview will be generated here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/customer.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/invoice.js"></script>
    
    <!-- Stripe Payment Integration -->
    <script type="module">
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';
        import { getApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        
        // Payment function
        window.payWithStripe = async function(amount, invoiceNumber, customerEmail, customerName) {
            try {
                // Show loading state
                const button = event.target;
                const originalHTML = button.innerHTML;
                button.disabled = true;
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                
                // Get Firebase Functions
                const functions = getFunctions(getApp());
                
                // Call Cloud Function to create checkout session
                const createCheckoutSession = httpsCallable(functions, 'createCheckoutSession');
                const result = await createCheckoutSession({
                    amount: amount,
                    invoiceNumber: invoiceNumber,
                    customerEmail: customerEmail,
                    customerName: customerName,
                    returnUrl: window.location.origin + window.location.pathname
                });
                
                // Redirect to Stripe Checkout
                window.location.href = result.data.url;
                
            } catch (error) {
                console.error('Payment error:', error);
                alert('Unable to process payment: ' + error.message);
                
                // Reset button
                if (button) {
                    button.disabled = false;
                    button.innerHTML = originalHTML;
                }
            }
        };
        
        // Check for payment success/cancellation on page load
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const payment = urlParams.get('payment');
            
            if (payment === 'success') {
                alert('✅ Payment successful! Thank you for your payment.');
                // Clear URL parameters
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (payment === 'cancelled') {
                alert('❌ Payment cancelled. You can try again or use E-Transfer.');
                // Clear URL parameters
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
